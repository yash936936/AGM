[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agm"
version = "0.5.1"
description = "Adaptive Graph Memory prototype with graph retrieval, trust, handoff, REST, MCP and lifecycle evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "numpy",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "mcp>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx>=0.27,<1"]

[project.scripts]
agm = "agm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
