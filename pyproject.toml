[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agm"
version = "0.2.0"
description = "Adaptive Graph Memory prototype, Phase 2 graph-aware retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
agm = "agm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
