name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check repository hygiene
        run: python scripts/check_repo_hygiene.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Run test suite
        run: python -m pytest -q
      - name: Run REST integration smoke client
        run: python examples/rest_smoke_client.py
      - name: Build wheel and inspect package contents
        run: python scripts/check_package.py
